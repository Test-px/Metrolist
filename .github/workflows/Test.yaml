name: 🔨 Manual Test Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"

jobs:
  build:
    name: Build Signed Release APK & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create Keystore properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Calculate Sequential Version
        id: versioning
        run: |
          LATEST_TAG=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ]; then
            NEXT_NUM=1
          else
            LAST_NUM=$(echo "$LATEST_TAG" | sed 's/[^0-9]*//g')
            NEXT_NUM=$((LAST_NUM + 1))
          fi
          echo "Next version will be test-build-$NEXT_NUM"
          echo "NEXT_NUM=$NEXT_NUM" >> $GITHUB_ENV
          echo "TAG_NAME=test-build-$NEXT_NUM" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleGmsRelease assembleFossRelease --warning-mode summary

      - name: Prepare Release Notes
        run: |
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          if [ -f changelog.md ]; then
            cat changelog.md >> $GITHUB_ENV
          elif [ -f changelog.txt ]; then
            cat changelog.txt >> $GITHUB_ENV
          else
            echo "Automated test build #${{ env.NEXT_NUM }}." >> $GITHUB_ENV
          fi
          echo "EOF" >> $GITHUB_ENV

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Test Build ${{ env.NEXT_NUM }}
          body: ${{ env.RELEASE_BODY }}
          files: app/build/outputs/apk/**/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Clean Up Older Releases (Keep Last 3)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName -q ".[].tagName" | tail -n +4 | while read -r tag; do
            if [ -n "$tag" ] && [ "$tag" != "${{ env.TAG_NAME }}" ]; then
              gh release delete "$tag" --cleanup-tag -y || true
            fi
          done

      - name: Send APK to Telegram
        if: ${{ env.BOT_TOKEN != '' && env.CHAT_ID != '' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            curl -s -F "chat_id=${CHAT_ID}" \
                 -F "document=@${APK_FILE}" \
                 -F "caption=🔨 *Test Build #${{ env.NEXT_NUM }}*" \
                 https://api.telegram.org/bot${BOT_TOKEN}/sendDocument || true
          fi
